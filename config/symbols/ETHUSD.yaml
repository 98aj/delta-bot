# Ready for later: add ETHUSD to `symbols` in settings.yaml to enable.
# Same setup as BTC. ETH backtest 2020-26 (Supertrend > Williams, 1% risk): ~19%/yr, max DD -15%.
symbol: ETHUSD
enabled: true
max_contracts: 2000
fixed_contracts: 0

strategies:
  - name: supertrend_4h
    enabled: true
    params: {period: 20, mult: 4.0, stop_atr: 2.0}
  - name: williams_intraday
    enabled: true
    params: {k: 0.5, trend_filter: true, trend_sma_days: 20, last_entry_hour: 20}
  - name: trend_ema_4h
    enabled: false
    params: {fast: 20, slow: 50, adx_min: 20, stop_atr: 2.0, trail_atr: 3.0}
