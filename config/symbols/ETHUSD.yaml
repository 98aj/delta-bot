# ETHUSD is enabled in settings.yaml `symbols`; shares the account balance and leverage cap with BTCUSD.
# Priority order: ema_pullback (4h) first, williams_intraday (1h) only while ema_pullback is flat. Same settings
# as BTC (chosen on BTC only, so ETH is unseen data). Old setup ST > TEP > Williams with preempt: 11.6%/yr, DD -11.9%.
symbol: ETHUSD
enabled: true
max_contracts: 2000
fixed_contracts: 0
# Backtest ETH Apr 2024-Nov 2026 at 1% risk, ema_pullback > williams k=0.7, preempt off: CAGR 34.4%, DD -13.1%
# (ema_pullback alone: 29.2%, DD -12.4%; preempt on: 32.0%, DD -14.1%). Only ~41 Williams trades: thin evidence.
preempt: false

strategies:
  # trend_rider: same trades as ema_pullback, but sized by setup quality (x0.5 on EMA-cross entries, x0.25 when
  # ADX > 35 or volatility is in its top third), all scaled by boost 1.5. ON for ETH since 2026-11-22.
  # Never enable both trend_rider and ema_pullback (same trades twice). BTC stays on ema_pullback.
  # Live-settings backtest Jun 2024-Nov 2026 from $10k, Williams off: BTC ema + ETH rider $82.6k (DD -28.6%),
  # both ema_pullback $64.4k (-29.8%), both rider $74.2k (-31.0%), BTC rider + ETH ema $52.0k (-28.4%).
  # Live-settings backtest (2% risk, shared balance, hourly mark-to-market DD), BTC+ETH 2024-26 from $10k:
  # $74.2k vs $65.9k for ema_pullback > williams at the same -31% drawdown. BTC 2020-26: a tie (2000-contract cap).
  - name: trend_rider
    enabled: true
    params: {tf: 4, fast: 50, slow: 100, pb_window: 6, adx_min: 20, cross_entry: true, boost: 1.5}

  - name: ema_pullback       # OFF on ETH (replaced by trend_rider above); same entries and exits
    enabled: false
    params: {tf: 4, fast: 50, slow: 100, pb_ema: 50, pb_atr: 0.0, pb_window: 6, adx_min: 20, cross_entry: true}

  - name: williams_intraday  # OFF (turned off 2026-11-22). Intraday (1h); when on: trades only while ema_pullback is flat; flat by 00:00 UTC
    enabled: false           # (05:30 IST). k=0.7 = fewer, stronger breakouts than the old k=0.5
    params: {k: 0.7, trend_filter: true, trend_sma_days: 20, last_entry_hour: 20}
