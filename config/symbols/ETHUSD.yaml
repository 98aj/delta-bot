# ETHUSD is enabled in settings.yaml `symbols`; shares the account balance and leverage cap with BTCUSD.
# Priority order: ema_pullback (4h) first, williams_intraday (1h) only while ema_pullback is flat. Same settings
# as BTC (chosen on BTC only, so ETH is unseen data). Old setup ST > TEP > Williams with preempt: 11.6%/yr, DD -11.9%.
symbol: ETHUSD
enabled: true
max_contracts: 2000
fixed_contracts: 0
# Backtest ETH Apr 2024-Nov 2026 at 1% risk, ema_pullback > williams k=0.7, preempt off: CAGR 34.4%, DD -13.1%
# (ema_pullback alone: 29.2%, DD -12.4%; preempt on: 32.0%, DD -14.1%). Only ~41 Williams trades: thin evidence.
preempt: false

strategies:
  - name: ema_pullback
    enabled: true
    params: {tf: 4, fast: 50, slow: 100, pb_ema: 50, pb_atr: 0.0, pb_window: 6, adx_min: 20, cross_entry: true}

  - name: williams_intraday  # intraday (1h), priority 2: trades only while ema_pullback is flat; flat by 00:00 UTC
    enabled: true            # (05:30 IST). k=0.7 = fewer, stronger breakouts than the old k=0.5
    params: {k: 0.7, trend_filter: true, trend_sma_days: 20, last_entry_hour: 20}
