symbol: BTCUSD
enabled: true
max_contracts: 2000          # hard cap per position (1 contract = 0.001 BTC)
fixed_contracts: 0           # 0 = lot size from risk_pct (recommended). e.g. 5 = always 5 contracts (0.005 BTC),
                             #     still limited by max_leverage and max_trade_risk_pct in settings.yaml

# Priority order: ema_pullback (4h) first, williams_intraday (1h) only while ema_pullback is flat.
# Delta keeps ONE net position per contract. Supertrend and TEP lowered the result, so they are not used
# (their code is still in src/deltabot/strategies). Old setup ST > TEP > Williams: 16.7%/yr, DD -18.1%.
# Backtest BTC 2020-26 at 1% risk, ema_pullback > williams k=0.7, preempt on: CAGR 35.3%, max DD -10.3%
# (ema_pullback alone: 33.8%, DD -8.9%; preempt off: 31.3%, DD -15.4%). preempt on = an ema_pullback signal
# closes a running Williams trade and takes over.
preempt: true

strategies:
  - name: ema_pullback       # EMA 50/100 trend on 4h; enters on the cross and on reversal candles after a pullback
    enabled: true            # to EMA50 (ADX > 20); exits on the opposite 50/100 cross or the swing stop-loss
    params: {tf: 4, fast: 50, slow: 100, pb_ema: 50, pb_atr: 0.0, pb_window: 6, adx_min: 20, cross_entry: true}

  - name: williams_intraday  # intraday (1h), priority 2: trades only while ema_pullback is flat; flat by 00:00 UTC
    enabled: true            # (05:30 IST). k=0.7 = fewer, stronger breakouts than the old k=0.5
    params: {k: 0.7, trend_filter: true, trend_sma_days: 20, last_entry_hour: 20}
